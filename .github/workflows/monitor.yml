name: Monitor source

# Monthly, not quarterly. GitHub disables scheduled workflows in a public repository
# "when no repository activity has occurred in 60 days", so a 90-day interval would sit
# outside that window: on a quiet repo the workflow would switch itself off about a month
# before it was next due, and the failure mode is silence.
#
# Each run also commits the heartbeat, which is unambiguous activity and makes a check
# that stopped happening visible in git history.
on:
  schedule:
    - cron: '17 4 1 * *' # 04:17 UTC on the 1st
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  # The heartbeat commit needs an author. These are GitHub's own values for the Actions
  # bot: 41898282 is the numeric account id of github-actions[bot], and
  # <id>+<username>@users.noreply.github.com is how GitHub attributes a commit to an
  # account without exposing a real address. Using them makes the monthly commit show up
  # as the bot rather than as whoever last touched the repository.
  BOT_NAME: 'github-actions[bot]'
  BOT_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the official source
        id: check
        run: npm run monitor -w @kviz/monitor
        continue-on-error: true

      - name: Record the heartbeat
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add packages/monitor/baseline.json
          git diff --staged --quiet || git commit -m "Monitor: checked on $(date -u +%Y-%m-%d)"
          git push

      - name: Report
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const { checkedAt } = JSON.parse(fs.readFileSync('packages/monitor/baseline.json', 'utf8'));
            const failed = '${{ steps.check.outcome }}' !== 'success';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              `Last checked: **${checkedAt}**`,
              '',
              failed
                ? `⚠️ The check did not pass. See [the run](${run}) for what changed or could not be verified.`
                : `✅ Verified — the official question bank matches our copy.`,
              '',
              `_Updated automatically by the monitor workflow._`,
            ].join('\n');

            // One long-lived issue, edited rather than commented on: a clean run makes no
            // noise, but a stale "last checked" date is visible.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'monitor',
            });

            if (open.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Source monitor', body, labels: ['monitor'],
              });
            }

            if (failed) core.setFailed('Monitor did not pass');
